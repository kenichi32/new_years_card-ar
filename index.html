<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>カメラテスト</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; }
    #bar { position:fixed; top:0; left:0; right:0; padding:10px; background:#111; color:#fff; z-index:10; }
    #btn { padding:10px 12px; font-size:16px; }
    #status { margin-top:8px; font-size:14px; opacity:0.95; }
    video { width:100vw; height:100vh; object-fit:cover; background:#000; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="btn">カメラ開始</button>
    <div id="status">未開始</div>
  </div>
  <video id="v" playsinline muted autoplay></video>

  <script>
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const v = document.getElementById("v");

    btn.onclick = async () => {
      statusEl.textContent = "要求中...";
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          statusEl.textContent = "getUserMedia が利用できません（ブラウザ/環境の問題）";
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });

        v.srcObject = stream;
        statusEl.textContent = "カメラOK（映像が出れば成功）";
      } catch (e) {
        statusEl.textContent = "カメラNG: " + e.name + (e.message ? " / " + e.message : "");
      }
    };
  </script>
</body>
</html>
