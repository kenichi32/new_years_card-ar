<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>New Year AR Video</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

<style>
  body { margin:0; background:#000; }
  #fallback {
    position:fixed; bottom:16px; left:0; right:0;
    display:flex; justify-content:center;
  }
  a {
    padding:12px 16px; border-radius:10px;
    background:#007aff; color:#fff; text-decoration:none;
  }
</style>
</head>

<body>

<!-- 🎥 音声なし MP4 動画 -->
<video id="video-src"
  src="./video.mp4"
  loop
  muted
  playsinline
  webkit-playsinline
  crossorigin="anonymous">
</video>

<a-scene
  embedded
  arjs="trackingMethod: best; sourceType: webcam;"
  vr-mode-ui="enabled: false">

  <!-- 🧧 年賀状に印刷したマーカー -->
  <a-marker
    type="pattern"
    url="./marker.patt">

    <!-- 年賀状の上に浮かぶ動画 -->
    <a-video
      id="video-plane"
      src="#video-src"
      width="1.3"
      height="0.73"
      rotation="-90 0 0">
    </a-video>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- 🔁 フォールバック（通常動画再生） -->
<div id="fallback">
  <a href="./video.mp4">ARがうまく表示できない場合はこちら</a>
</div>

<script>
const video = document.getElementById("video-src");
const marker = document.querySelector("a-marker");

// ▶ マーカーが見えたら再生（音なし）
marker.addEventListener("markerFound", () => {
  video.currentTime = 0; // 毎回頭から再生
  video.play();
});

// ⏹ 見失ったら停止
marker.addEventListener("markerLost", () => {
  video.pause();
});
</script>

</body>
</html>
