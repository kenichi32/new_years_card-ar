<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>AR Marker Video</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>

<style>
  html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
  }

  /* 画面にフィット（PCでも欠けない） */
  a-scene {
    position:fixed !important;
    top:0;
    left:0;
    width:100% !important;
    height:100% !important;
  }

  /* フォールバック用リンク */
  #fallback {
    position:fixed;
    bottom:16px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    pointer-events:auto;
  }

  #fallback a {
    padding:12px 16px;
    border-radius:10px;
    background:#007aff;
    color:#fff;
    text-decoration:none;
    font-size:14px;
  }
</style>
</head>

<body>

<!-- 🎥 音声なし MP4（iPhone対応設定） -->
<video id="video-src"
  src="./video.mp4"
  loop
  muted
  playsinline
  webkit-playsinline
  crossorigin="anonymous">
</video>

<a-scene
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true;"
  arjs="trackingMethod: best; sourceType: webcam;">

  <!-- 🧧 年賀状に印刷したマーカー -->
  <a-marker
    type="pattern"
    url="./marker.patt">

    <!-- 🎬 マーカー上に表示される動画スクリーン -->
    <a-video
      id="video-plane"
      src="#video-src"
      width="1.4"
      height="0.79"
      rotation="-90 0 0">
    </a-video>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- 🔁 フォールバック（通常動画再生） -->
<div id="fallback">
  <a href="./video.mp4">ARが表示されない場合はこちらから再生</a>
</div>

<script>
const video  = document.getElementById("video-src");
const marker = document.querySelector("a-marker");

/* 🍎 iPhone対策：
   初回タップで再生権限を解放（自動再生規制回避） */
document.body.addEventListener("touchstart", () => {
  video.play();
  video.pause();
}, { once:true });

/* ▶ マーカーが見えたら再生（毎回頭から） */
marker.addEventListener("markerFound", () => {
  video.currentTime = 0;
  video.play();
});

/* ⏹ マーカーが外れたら停止 */
marker.addEventListener("markerLost", () => {
  video.pause();
});
</script>

</body>
</html>
