<!doctype html>
<html>
<body>
<button id="b">カメラテスト</button>
<script>
document.getElementById("b").onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: true });
    alert("カメラOK");
    s.getTracks().forEach(t => t.stop());
  } catch(e) {
    alert("カメラNG: " + e.name);
  }
};
</script>
</body>
</html>
