<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>年賀状AR</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    }

    #startArea {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 18px;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }

    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px;
      text-align: center;
      font-size: 14px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- タップ領域（buttonではない） -->
  <div id="startArea">
    画面をタップしてARを開始
  </div>

  <div id="hint">
    年賀状の絵にカメラをかざしてください
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.152.2/build/three.module.js";
    import { MindARThree } from "https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-three.esm.js";

    const startArea = document.getElementById("startArea");
    let started = false;

    async function startAR() {
      if (started) return;
      started = true;

      startArea.textContent = "起動中…";

      try {
        const mindarThree = new MindARThree({
          container: document.body,
          imageTargetSrc: "./targets.mind",
          uiScanning: true,
          uiLoading: true,
        });

        const { renderer, scene, camera } = mindarThree;

        scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

        const anchor = mindarThree.addAnchor(0);
        const plane = new THREE.Mesh(
          new THREE.PlaneGeometry(1, 0.6),
          new THREE.MeshBasicMaterial({ color: 0xff4444 })
        );
        plane.position.set(0, 0.1, 0);
        anchor.group.add(plane);

        await mindarThree.start();

        startArea.remove(); // ← 起動後に消す

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

      } catch (e) {
        startArea.textContent = "起動失敗: " + e;
        console.error(e);
      }
    }

    // Safari確実発火用
    startArea.addEventListener("touchend", startAR, { passive: true });
    startArea.addEventListener("click", startAR);
  </script>

</body>
</html>
